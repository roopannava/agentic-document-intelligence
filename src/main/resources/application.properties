spring.application.name=statement_backend

# Bind to the port Heroku assigns at runtime; fall back to 8080 locally.
server.port=${PORT:8080}

# All AWS resources live in the project Region (us-east-2) per the account rules.
aws.region=us-east-2

# S3 bucket that holds the uploaded PDF for async Textract.
# Set your own bucket via the APP_S3_BUCKET env var (keeps the account-specific
# name out of source control). Create it once:
#   export APP_S3_BUCKET=your-statement-bucket
#   aws s3 mb s3://$APP_S3_BUCKET --region us-east-2
app.s3.bucket=${APP_S3_BUCKET:your-statement-bucket}

# Which LLM "door" the categorizer uses:
#   bedrock   - Claude via Amazon Bedrock (IAM auth; the all-AWS production story).
#   anthropic - Claude via the Anthropic API directly (ANTHROPIC_API_KEY; no Bedrock).
# Currently "anthropic" so the pipeline runs while the Bedrock account-verification
# hold keeps the us-east-2 inference quota at 0.
app.llm.provider=anthropic

# Claude on Bedrock, via the us- cross-region inference profile (required for
# on-demand invocation of current Claude models). Haiku: cheap + fast, the right
# tier for a simple categorization task. Used when app.llm.provider=bedrock.
app.bedrock.model-id=us.anthropic.claude-haiku-4-5-20251001-v1:0

# Claude on the Anthropic API. Used when app.llm.provider=anthropic.
# Haiku 5.5: current, cheapest tier, right for simple categorization.
app.anthropic.model-id=claude-haiku-5-5

# Agentic demo (/api/agentic/process): the lead orchestrator and its subagents.
# Both default to Haiku 5.5 (cheap); bump the lead to a stronger model if you want
# to show tiered orchestration (e.g. claude-sonnet-5-5 lead, claude-haiku-5-5 workers).
app.agentic.lead-model=claude-haiku-5-5
app.agentic.subagent-model=claude-haiku-5-5

# Bank statements are small PDFs, but the Spring default multipart cap is ~1MB.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
