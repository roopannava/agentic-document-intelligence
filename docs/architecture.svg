<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowClay" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C2410C"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <style>
      .title { font-size: 26px; font-weight: 700; fill: #0f172a; }
      .sub   { font-size: 14px; fill: #475569; }
      .box   { rx: 12; filter: url(#shadow); }
      .btitle{ font-size: 15px; font-weight: 700; }
      .bsub  { font-size: 12px; }
      .lbl   { font-size: 12.5px; fill: #334155; font-weight: 600; }
      .note  { font-size: 11.5px; fill: #64748b; font-style: italic; }
      .stepN { font-size: 12px; font-weight: 700; fill: #ffffff; }
      .mono  { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    </style>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1280" height="820" fill="#ffffff"/>

  <!-- header -->
  <text x="40" y="46" class="title">Document Intelligence Pipeline — Bank-Statement Categorization</text>
  <text x="40" y="72" class="sub">PDF → S3 → Amazon Textract → Claude Haiku → JSON. A Spring Boot orchestrator; Claude reached two ways: Amazon Bedrock (IAM) or the Anthropic API (key).</text>

  <!-- ================= CLIENT ================= -->
  <g>
    <rect class="box" x="40" y="120" width="180" height="88" fill="#1e293b"/>
    <text x="130" y="158" text-anchor="middle" class="btitle" fill="#ffffff">Client</text>
    <text x="130" y="180" text-anchor="middle" class="bsub" fill="#cbd5e1">curl / app — uploads a PDF</text>
  </g>

  <!-- ================= ORCHESTRATOR (hub) ================= -->
  <g>
    <rect class="box" x="360" y="108" width="330" height="120" fill="#eafff0" stroke="#6DB33F" stroke-width="2.5"/>
    <text x="525" y="140" text-anchor="middle" class="btitle" fill="#2f6b16">Spring Boot — Orchestrator</text>
    <text x="525" y="162" text-anchor="middle" class="bsub" fill="#3f6b2a">POST /api/categorize</text>
    <text x="525" y="182" text-anchor="middle" class="bsub" fill="#3f6b2a">upload → extract → categorize → filter</text>
    <text x="525" y="202" text-anchor="middle" class="bsub" fill="#3f6b2a">IAM creds for AWS · API key for Anthropic</text>
  </g>

  <!-- ================= S3 ================= -->
  <g>
    <rect class="box" x="60" y="380" width="220" height="120" fill="#e8f6e6" stroke="#569A31" stroke-width="2.5"/>
    <text x="170" y="412" text-anchor="middle" class="btitle" fill="#2f6b16">Amazon S3</text>
    <text x="170" y="434" text-anchor="middle" class="bsub" fill="#3f6b2a">holds the PDF briefly</text>
    <text x="170" y="452" text-anchor="middle" class="bsub" fill="#3f6b2a">(the mailbox async Textract reads)</text>
    <text x="170" y="480" text-anchor="middle" class="note">deleted in finally — PII kept no</text>
    <text x="170" y="494" text-anchor="middle" class="note">longer than extraction needs</text>
  </g>

  <!-- ================= TEXTRACT ================= -->
  <g>
    <rect class="box" x="400" y="388" width="250" height="112" fill="#f6e9fb" stroke="#C925D1" stroke-width="2.5"/>
    <text x="525" y="420" text-anchor="middle" class="btitle" fill="#8e1a99">Amazon Textract</text>
    <text x="525" y="442" text-anchor="middle" class="bsub" fill="#6b1273">async StartDocumentAnalysis (TABLES)</text>
    <text x="525" y="462" text-anchor="middle" class="bsub" fill="#6b1273">PDF → transaction rows</text>
    <text x="525" y="484" text-anchor="middle" class="note">deterministic — not an LLM</text>
  </g>

  <!-- ================= CLAUDE (two doors) ================= -->
  <g>
    <rect class="box" x="840" y="100" width="400" height="330" fill="#fdf1ec" stroke="#D97757" stroke-width="2.5"/>
    <text x="1040" y="134" text-anchor="middle" class="btitle" fill="#b23f1d">Claude Haiku — Categorizer</text>
    <text x="1040" y="156" text-anchor="middle" class="bsub" fill="#9a4426">labels each transaction:</text>
    <text x="1040" y="174" text-anchor="middle" class="bsub" fill="#9a4426">grocery · gas · restaurant · other (+ confidence)</text>

    <!-- door A: Bedrock -->
    <rect x="870" y="196" width="340" height="96" rx="10" fill="#fff4e6" stroke="#FF9900" stroke-width="2"/>
    <text x="1040" y="224" text-anchor="middle" class="btitle" fill="#b06a00">Door A — Amazon Bedrock</text>
    <text x="1040" y="246" text-anchor="middle" class="bsub" fill="#8a5400">Converse API · IAM auth (no key)</text>
    <text x="1040" y="264" text-anchor="middle" class="bsub" fill="#8a5400">us.anthropic.claude-haiku-4-5</text>
    <text x="1040" y="282" text-anchor="middle" class="note">all-AWS story · tool/contract</text>

    <!-- door B: Anthropic API -->
    <rect x="870" y="306" width="340" height="96" rx="10" fill="#fbe7df" stroke="#D97757" stroke-width="2"/>
    <text x="1040" y="334" text-anchor="middle" class="btitle" fill="#b23f1d">Door B — Anthropic API</text>
    <text x="1040" y="356" text-anchor="middle" class="bsub" fill="#9a4426">ANTHROPIC_API_KEY · not AWS</text>
    <text x="1040" y="374" text-anchor="middle" class="bsub" fill="#9a4426">claude-haiku-5-5 · structured output</text>
    <text x="1040" y="392" text-anchor="middle" class="note">same Claude · one config flag</text>
  </g>

  <!-- ================= RESPONSE ================= -->
  <g>
    <rect class="box" x="60" y="610" width="620" height="160" fill="#0f172a"/>
    <text x="80" y="640" class="btitle" fill="#e2e8f0">Response — CategorizeResponse (JSON)</text>
    <text x="80" y="668" class="mono" fill="#86efac">{ "transactionCount": 14,</text>
    <text x="80" y="688" class="mono" fill="#86efac">&#160;&#160;"grocery":   [ "WHOLE FOODS", "SAFEWAY", "TRADER JOE'S" ],</text>
    <text x="80" y="708" class="mono" fill="#86efac">&#160;&#160;"gas":       [ "SHELL", "CHEVRON", "EXXONMOBIL" ],</text>
    <text x="80" y="728" class="mono" fill="#86efac">&#160;&#160;"restaurant":[ "STARBUCKS", "CHIPOTLE", "PANERA" ],</text>
    <text x="80" y="748" class="mono" fill="#fca5a5">&#160;&#160;"missingInfo": [ "SQ *XYZ UNKNOWN MERCH — too cryptic (low)" ] }</text>
  </g>

  <!-- ================= ARROWS ================= -->
  <!-- 1 client -> orchestrator -->
  <line x1="220" y1="164" x2="354" y2="168" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <circle cx="287" cy="150" r="13" fill="#1f2937"/><text x="287" y="154" text-anchor="middle" class="stepN">1</text>
  <text x="287" y="128" text-anchor="middle" class="lbl">POST PDF</text>

  <!-- 2 orchestrator -> S3 (upload) -->
  <line x1="420" y1="228" x2="210" y2="374" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <circle cx="300" cy="300" r="13" fill="#1f2937"/><text x="300" y="304" text-anchor="middle" class="stepN">2</text>
  <text x="230" y="300" text-anchor="middle" class="lbl">upload</text>

  <!-- 3 textract -> S3 (reads) -->
  <line x1="400" y1="446" x2="286" y2="440" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <circle cx="345" cy="443" r="13" fill="#1f2937"/><text x="345" y="447" text-anchor="middle" class="stepN">3</text>
  <text x="345" y="372" text-anchor="middle" class="lbl">reads from S3</text>

  <!-- 4 orchestrator <-> textract -->
  <line x1="560" y1="228" x2="560" y2="384" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <circle cx="560" cy="306" r="13" fill="#1f2937"/><text x="560" y="310" text-anchor="middle" class="stepN">4</text>
  <text x="640" y="302" text-anchor="middle" class="lbl">start job → rows</text>

  <!-- 5 orchestrator <-> claude -->
  <line x1="690" y1="160" x2="834" y2="160" stroke="#C2410C" stroke-width="2.5" marker-end="url(#arrowClay)" marker-start="url(#arrowClay)"/>
  <circle cx="762" cy="142" r="13" fill="#b23f1d"/><text x="762" y="146" text-anchor="middle" class="stepN">5</text>
  <text x="762" y="120" text-anchor="middle" class="lbl">categorize ⇄ result</text>

  <!-- 6 orchestrator -> response -->
  <line x1="430" y1="228" x2="400" y2="604" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <circle cx="412" cy="420" r="13" fill="#1f2937"/><text x="412" y="424" text-anchor="middle" class="stepN">6</text>
  <text x="332" y="560" text-anchor="middle" class="lbl">JSON → client</text>

  <!-- ================= LEGEND ================= -->
  <g>
    <rect x="760" y="610" width="480" height="160" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="784" y="638" class="btitle" fill="#0f172a">Legend</text>

    <rect x="784" y="652" width="18" height="18" rx="4" fill="#eafff0" stroke="#6DB33F" stroke-width="2"/>
    <text x="812" y="666" class="bsub" fill="#334155">Your Spring Boot code (the orchestrator)</text>

    <rect x="784" y="680" width="18" height="18" rx="4" fill="#e8f6e6" stroke="#569A31" stroke-width="2"/>
    <text x="812" y="694" class="bsub" fill="#334155">AWS managed service — S3, Textract, Bedrock</text>

    <rect x="784" y="708" width="18" height="18" rx="4" fill="#fdf1ec" stroke="#D97757" stroke-width="2"/>
    <text x="812" y="722" class="bsub" fill="#334155">Claude (the model) — reached via Bedrock or the Anthropic API</text>

    <rect x="784" y="736" width="18" height="18" rx="4" fill="#1e293b"/>
    <text x="812" y="750" class="bsub" fill="#334155">Client / response</text>
  </g>
</svg>
